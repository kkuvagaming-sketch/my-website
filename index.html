<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedySMM Services</title>
    <style>
        body {
            background-color: #1a103c;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #271b4e;
            padding: 20px;
            border-radius: 12px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #443377;
            background: #1a103c;
            color: #fff;
            box-sizing: border-box;
        }
        .google-btn {
            display: block;
            text-align: center;
            background-color: #ffffff;
            color: #333333;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="#" class="google-btn">🌐 Login with Google</a>

        <div class="form-group">
            <label>Category</label>
            <select id="category">
                <option>▶️ YouTube Services</option>
                <option>📸 Instagram Followers [Guaranteed]</option>
            </select>
        </div>

        <div class="form-group">
            <label>Service</label>
            <select id="service">
                <option>▶️ YouTube Subscribers (1k) [30 Days Guarantee] - ₹4500</option>
                <option>👍 YouTube Likes [High Quality] - ₹3500</option>
                <option>📸 Instagram Followers [Refill - 365 days]</option>
            </select>
        </div>

        <div class="form-group">
            <label>Link</label>
            <input type="text" id="link" placeholder="Profile or Video link">
        </div>

        <div class="form-group">
            <label>Quantity</label>
            <input type="number" id="quantity" value="1">
        </div>

        <button class="submit-btn" onclick="sendOrder()">Submit Order</button>
    </div>
    <script>
        function sendOrder() {
            let service = document.getElementById('service').value;
            let link = document.getElementById('link').value;
            let quantity = document.getElementById('quantity').value;

            if(!link) {
                alert('कृपया लिंक दर्ज करें!');
                return;
            }

            let botToken = "8874066572:AAEVD3W7U19p11H6NkaU24cDBmH-QRGc_I";
            let chatId = "8682676688";
            let text = `📦 नया SMM ऑर्डर मिला!\n\n🔧 सर्विस: ${service}\n🔗 लिंक: ${link}\n📊 मात्रा: ${quantity}`;
            
            let url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=` + encodeURIComponent(text);

            fetch(url)
                .then(response => {
                    if (response.ok) {
                        alert('आपका ऑर्डर सफलतापूर्वक टेलीग्राम पर भेज दिया गया है!');
                    } else {
                        alert('ऑर्डर भेजने में कुछ समस्या आई।');
                    }
                })
                .catch(error => {
                    alert('कनेक्शन एरर!');
                });
        }
    </script>
