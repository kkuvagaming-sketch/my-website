<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    text-align:center;

.container{
    max-width:400px;
    margin:50px auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}
input,select,button{
    width:100%;
    padding:10px;
    margin:10px 0;
}
button{
    background:#007bff;
    color:#fff;
    border:none;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="container">
<h2>SMM Panel Demo</h2>

<input type="text" placeholder="YouTube Link">

<select>
<option>YouTube Views</option>
<option>YouTube Likes</option>
<option>YouTube Subscribers (Demo)</option>
</select>

<input type="number" placeholder="Quantity">

<button onclick="alert('Demo only - No real order placed')">
Place Order
</button>

</div>

</body>
