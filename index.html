<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सुमित का पेज</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
            font-size: 24px;
        }
        p {
            color: #666;
            font-size: 14px;
        }
        .btn {
            display: block;
            background-color: #007BFF;
            color: white;
            padding: 12px;
            margin: 15px 0;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>सुमित 📱</h1>
        <p>नमस्ते! यह मेरा मोबाइल पेज है।</p>
        
        <a href="mailto:apka.email@example.com" class="btn">📧 ईमेल भेजें</a>
        <a href="#" class="btn">🌐 मेरी वेबसाइट</a>
        <a href="#" class="btn">💬 चैट करें</a>
    </div>

</body>
</html>
