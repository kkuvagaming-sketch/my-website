 <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नया मोबाइल खरीदने के लिए डोनेशन</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .donation-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
            margin-bottom: 15px;
        }
        h2 {
            color: #333;
            margin: 10px 0;
        }
        .message-box {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin: 15px 0;
            line-height: 1.5;
            text-align: left;
        }
        .qr-container {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
        .qr-code {
            width: 100%;
            max-width: 230px;
            height: auto;
            border-radius: 8px;
        }
        .upi-id {
            margin-top: 10px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="donation-card">
        <img src="IMG-20260722-WA0000.jpg" alt="Profile Photo" class="profile-img">
        
        <h2>Jorubhai Solanki</h2>
        
        <div class="message-box">
            <strong>नमस्ते दोस्तों!</strong><br>
            मुझे एक नया मोबाइल फोन लेना है, और इस सपने को पूरा करने के लिए मुझे आपके छोटे से सहयोग की ज़रूरत है। कृपया जितना हो सके उतना डोनेशन देकर मेरी मदद करें। आपके हर छोटे सहयोग से मेरा यह सपना पूरा हो सकता है। दिल से बहुत-बहुत धन्यवाद!
        </div>
        
        <div class="qr-container">
            <img src="IMG-20260722-WA0000.jpg" alt="UPI QR Code" class="qr-code">
            <div class="upi-id">UPI ID: jorubhaisolanki73@oksbi</div>
        </div>
    </div>

</body>
</html>
