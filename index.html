<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMM Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0b021a; color: #ffffff; padding: 15px; }
    .container { max-width: 450px; margin: 0 auto; }
    
    /* Stats Cards Layout */
    .stats-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .stat-card { background: linear-gradient(135deg, #1e1138, #12072b); border: 1px solid #2d1b54; border-radius: 12px; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
    .stat-info h3 { font-size: 13px; color: #a0a0a0; font-weight: 500; margin-bottom: 4px; }
    .stat-info p { font-size: 18px; font-weight: bold; color: #ffffff; }
    .stat-icon { font-size: 24px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="stats-grid">
      
      <div class="stat-card">
        <div class="stat-info">
          <h3>User Account</h3>
          <p>Kuvagaming</p>
        </div>
        <div class="stat-icon">👤</div>
      </div>

      <div class="stat-card">
        <div class="stat-info">
          <h3>Spent Balance</h3>
          <p>₹0.00</p>
        </div>
        <div class="stat-icon">💰</div>
      </div>

      <div class="stat-card">
        <div class="stat-info">
          <h3>Total Orders</h3>
          <p>0</p>
        </div>
        <div class="stat-icon">📦</div>
      </div>

    </div>
  </div>

</body>
</html>
