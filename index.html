<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>રિવોર્ડ વેબસાઇટ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: #ffffff;
            margin: 40px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .wallet {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
        }
        .btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>કમાણી અને રિડિમ</h2>
        <div class="wallet">તમારા કોઈન: <span id="coinCount">0</span> 🪙</div>
        <p>₹10 નો રિડિમ કોડ મેળવવા માટે ૧૦૦૦ કોઈન પૂરા કરો.</p>
        <button class="btn" onclick="redeemCode()">રિડિમ કોડ લો 🎟️</button>
    </div>

    <script>
        // વેબસાઇટ લોગિન થતાં જ ૧૦ કોઈન બોનસ આપવું
        let coins = 10; 
        document.getElementById("coinCount").innerText = coins;

        function redeemCode() {
            if (coins >= 1000) {
                coins -= 1000;
                document.getElementById("coinCount").innerText = coins;
                alert("अभिनंदन! તમારો ₹10 નો રિડિમ કોડ સફળતાપૂર્વક મળી ગયો છે. 🎉");
            } else {
                alert("રિડિમ કરવા માટે ઓછામાં ઓછા ૧૦૦૦ કોઈનની જરૂર છે! 🪙");
            }
        }
    </script>

</body>
</html>
