<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>फोन लेने के लिए डोनेशन</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .donation-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
            margin-bottom: 15px;
        }
        h2 {
            color: #333;
            margin: 10px 0;
        }
        p {
            color: #666;
            font-size: 15px;
            line-height: 1.5;
        }
        .qr-container {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
        .qr-code {
            width: 100%;
            max-width: 250px;
            height: auto;
            border-radius: 8px;
        }
        .upi-id {
            margin-top: 10px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="donation-card">
        <img src="YOUR_PHOTO_LINK.jpg" alt="मेरी फोटो" class="profile-img">
        
        <h2>Jorubhai Solanki</h2>
        <p>नमस्ते! नया फोन खरीदने के लिए मुझे आपके छोटे से सहयोग की आवश्यकता है। कृपया डोनेट करके मेरी मदद करें।</p>
        
        <div class="qr-container">
            <img src="1000027536.jpg" alt="UPI QR Code" class="qr-code">
            <div class="upi-id">UPI ID: jorubhaisolanki73@oksbi</div>
        </div>
    </div>

</body>
</html>
