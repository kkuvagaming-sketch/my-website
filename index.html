<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedySMM - YouTube Services</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; max-width: 500px; margin: auto;">

    <div style="background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h1 style="color: #333; text-align: center;">⚡ SpeedySMM Services</h1>
        <p style="color: #666; text-align: center;">Get instant YouTube growth safely. 🚀</p>

        <h2 style="color: #444; font-size: 18px;">📦 Available Services</h2>
        <ul style="color: #555; line-height: 1.6;">
            <li>📺 YouTube Subscribers (High Quality)</li>
            <li>👍 YouTube Video Likes</li>
            <li>🔥 YouTube Views (Non-Drop)</li>
        </ul>

        <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">

        <h2 style="color: #444; font-size: 18px;">🛒 Order Form</h2>
        <div id="orderForm">
            <label for="service" style="font-weight: bold; color: #333;">Select Service:</label><br>
            <select id="service" name="service" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px;">
                <option value="YouTube Subscribers">📺 YouTube Subscribers (High Quality)</option>
                <option value="YouTube Video Likes">👍 YouTube Video Likes</option>
                <option value="YouTube Views">🔥 YouTube Views (Non-Drop)</option>
            </select><br>

            <label for="quantity" style="font-weight: bold; color: #333;">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" value="1" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px;">

            <label for="link" style="font-weight: bold; color: #333;">YouTube Link:</label>
            <input type="text" id="link" name="link" placeholder="Enter video or channel link" style="width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 20px;">

            <button type="button" onclick="sendToTelegram()" style="width: 100%; padding: 12px; background: #0088cc; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Send Order to Telegram</button>
        </div>
    </div>

    <script>
    function sendToTelegram() {
        const token = "8874066572:AAEVG3DW7U19p11H6NkaU24cDBmH-QRGc_I"; 
        const chatId = "868267688"; 

        let service = document.getElementById('service').value;
        let quantity = document.getElementById('quantity').value;
        let link = document.getElementById('link').value;

        if (link.trim() === "") {
            alert("कृपया अपनी YouTube लिंक दर्ज करें!");
            return;
        }

        let message = `🔔 नया ऑर्डर मिला!\n\n📦 सेवा: ${service}\n🔢 मात्रा: ${quantity}\n🔗 लिंक: ${link}`;
        let telegramUrl = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

        fetch(telegramUrl)
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    alert("ऑर्डर सफलतापूर्वक टेलीग्राम पर भेज दिया गया है! 🎉");
                    document.getElementById('link').value = ""; 
                } else {
                    alert("संदेश भेजने में विफल। कृपया चैट आईडी जांचें।");
                }
            })
            .catch(error => {
                console.error("त्रुटि:", error);
                alert("कनेक्शन त्रुटि हुई!");
            });
    }
    </script>

</body>
</html>
